name: runrabbit_kiosk
description: In-store skin concern recommendation kiosk for RunRabbit (dummy data).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Keeps the tablet screen awake. The only third-party package on purpose (lightweight).
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/skin_types/
    - assets/images/concerns/
